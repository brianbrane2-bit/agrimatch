services:
  - type: web
    name: agrimatch-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: AT_USERNAME
        value: sandbox
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/agrimatch.db
      - key: AT_API_KEY
        sync: false
    disk:
      name: agrimatch-data
      mountPath: /var/data
      sizeGB: 1